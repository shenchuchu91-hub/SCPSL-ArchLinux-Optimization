<svg fill="none" viewBox="0 0 850 250" width="100%" height="250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="scpslBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14141e"/>
      <stop offset="50%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#0f0f17"/>
    </linearGradient>

    <linearGradient id="scpslTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff79c6"/>
      <stop offset="50%" stop-color="#bd93f9"/>
      <stop offset="100%" stop-color="#50fa7b"/>
    </linearGradient>

    <linearGradient id="scpslBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f38ba8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#a6e3a1" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#89dceb" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="waveSCPSL" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5555" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#bd93f9" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#50fa7b" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      font-weight: 800;
      font-size: 28px;
      fill: url(#scpslTitle);
      filter: drop-shadow(0px 2px 8px rgba(255, 121, 198, 0.4));
    }
    .subtitle {
      font-family: "Fira Code", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14.5px;
      font-weight: 500;
      fill: #cdd6f4;
      letter-spacing: 0.5px;
    }
    .badge-txt {
      font-family: "Fira Code", monospace;
      font-size: 11.5px;
      font-weight: bold;
    }
  </style>

  <rect x="2" y="2" width="846" height="246" rx="20" fill="url(#scpslBg)" stroke="url(#scpslBorder)" stroke-width="2"/>
  <path d="M2,165 C220,210 390,130 550,180 C710,230 780,150 848,185 L848,246 C848,246 848,246 846,248 L2,248 Z" fill="url(#waveSCPSL)"/>

  <text x="60" y="50" fill="#f9e2af" font-size="20">✦</text>
  <text x="780" y="65" fill="#f9e2af" font-size="24">✦</text>
  <text x="740" y="190" fill="#f9e2af" font-size="16">✧</text>
  <text x="100" y="200" fill="#f9e2af" font-size="16">✧</text>

  <!-- 左侧准星 / SCP 图标 -->
  <g transform="translate(50, 70)">
    <circle cx="45" cy="45" r="42" fill="#282a36" stroke="#50fa7b" stroke-width="2"/>
    <!-- 极客准星造型 -->
    <circle cx="45" cy="45" r="22" stroke="#ff79c6" stroke-width="2" fill="none"/>
    <line x1="45" y1="12" x2="45" y2="35" stroke="#50fa7b" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="45" y1="55" x2="45" y2="78" stroke="#50fa7b" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="12" y1="45" x2="35" y2="45" stroke="#50fa7b" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="55" y1="45" x2="78" y2="45" stroke="#50fa7b" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="45" cy="45" r="3" fill="#ff5555"/>
  </g>

  <!-- 中间文字区域 -->
  <g transform="translate(170, 0)">
    <text x="0" y="85" class="title">✨ SCPSL (秘密实验室) Linux 优化与准星避坑 ✨</text>
    <text x="0" y="125" class="subtitle">🌸 350+ 小时老玩家实战心得 · boot.config 满血调优 · 准星对中全解 🌸</text>

    <!-- 标签胶囊 -->
    <g transform="translate(0, 155)">
      <rect x="0" y="0" width="130" height="26" rx="13" fill="#282a36" stroke="#ff79c6" stroke-width="1"/>
      <text x="65" y="17" text-anchor="middle" fill="#ff79c6" class="badge-txt">🎯 准星无边框对中</text>

      <rect x="140" y="0" width="125" height="26" rx="13" fill="#282a36" stroke="#50fa7b" stroke-width="1"/>
      <text x="202" y="17" text-anchor="middle" fill="#50fa7b" class="badge-txt">⚡ 320 FPS 启动项</text>

      <rect x="275" y="0" width="135" height="26" rx="13" fill="#282a36" stroke="#8be9fd" stroke-width="1"/>
      <text x="342" y="17" text-anchor="middle" fill="#8be9fd" class="badge-txt">🔧 boot.config 多核</text>

      <rect x="420" y="0" width="105" height="26" rx="13" fill="#282a36" stroke="#f1fa8c" stroke-width="1"/>
      <text x="472" y="17" text-anchor="middle" fill="#f1fa8c" class="badge-txt">🎮 Wayland 畅玩</text>
    </g>

    <text x="0" y="215" fill="#a6e3a1" font-family="monospace" font-size="12.5">&gt; "实测 357 小时踩坑总结：拒绝全屏漂移，找回精准手感！"</text>
  </g>
</svg>
